<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VTuber Profile - SeztionVl</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Special+Elite&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">


<style>

:root{

--bg:#040508;

--card:
linear-gradient(
145deg,
#181c25,
#090b10
);


--gold:#d4af37;

--gold-light:#ffe55c;

--red:#9e0b0f;

--white:#f8f8ff;

--gray:#b0b5c5;


--detective:
'Cinzel',
serif;


--code:
'Special Elite',
monospace;


--thai:
'Kanit',
sans-serif;

}


/* =========================
 RESET
========================= */


*{

box-sizing:border-box;

margin:0;

padding:0;

user-select:none;

}



body{


min-height:100vh;

display:flex;

justify-content:center;

align-items:center;


padding:20px;


background:

radial-gradient(
circle at top,
#18202d,
#040508 55%
);


color:white;

font-family:var(--thai);

overflow-x:hidden;


position:relative;


}



/* =========================
 SNOW BACKGROUND
========================= */


body::before{


content:"";


position:fixed;

inset:0;


pointer-events:none;


z-index:0;


background-image:


radial-gradient(
circle,
rgba(255,255,255,.75) 2px,
transparent 3px
),


radial-gradient(
circle,
rgba(180,220,255,.55) 1px,
transparent 2px
);


background-size:


120px 120px,
60px 60px;


animation:

snowFall 18s linear infinite;


}



@keyframes snowFall{


from{


background-position:

0 -200px,
40px -300px;


}


to{


background-position:

120px 900px,
-80px 1000px;


}


}




/* =========================
 CARD
========================= */


.card-container{


position:relative;


width:100%;

max-width:440px;


background:var(--card);


border:1px solid rgba(212,175,55,.35);


clip-path:

polygon(
0 0,
calc(100% - 25px) 0,
100% 25px,
100% 100%,
25px 100%,
0 calc(100% - 25px)
);



box-shadow:


0 30px 70px black,

0 0 40px rgba(158,11,15,.2),


inset 0 0 30px rgba(0,0,0,.8);



overflow:hidden;


z-index:2;


isolation:isolate;


}



/* =========================
 ICE BORDER EFFECT
========================= */


.card-container::before{


content:"";


position:absolute;


inset:-3px;


background:

linear-gradient(

120deg,

transparent,

rgba(180,220,255,.8),

transparent,

rgba(212,175,55,.6),

transparent

);



background-size:300% 300%;


animation:

iceMove 8s infinite;


filter:blur(8px);


z-index:-1;


}



@keyframes iceMove{


0%{

background-position:0% 50%;

}


50%{

background-position:100% 50%;

}


100%{

background-position:0% 50%;

}


}



/* =========================
 FOG
========================= */


.card-container::after{


content:"";


position:absolute;


bottom:-40px;


left:-20%;


width:140%;


height:130px;



background:


radial-gradient(

ellipse,

rgba(180,220,255,.15),

transparent 70%

);


filter:blur(25px);



animation:

fogMove 12s ease-in-out infinite;



pointer-events:none;



z-index:1;


}



@keyframes fogMove{


0%,100%{


transform:translateX(-40px);

opacity:.3;


}


50%{


transform:translateX(40px);

opacity:.8;


}


}



/* =========================
 STAMP
========================= */


.stamp-badge{


position:absolute;


top:20px;


right:20px;



font-family:var(--code);


font-size:11px;


letter-spacing:2px;


color:#ff3333;


border:2px solid #ff3333;


padding:5px 10px;


transform:rotate(8deg);


background:rgba(0,0,0,.75);



z-index:5;



box-shadow:

0 5px 15px black;


animation:

stampFloat 4s infinite ease-in-out;


}



@keyframes stampFloat{


0%,100%{

transform:
rotate(8deg)
translateY(0);

}


50%{

transform:
rotate(8deg)
translateY(-4px);

}


}


/* =========================
 BANNER
========================= */


.banner-wrapper{


height:160px;


position:relative;


background:black;



border-bottom:

2px solid rgba(212,175,55,.4);


}


.banner-img{


width:100%;


height:100%;


object-fit:cover;


filter:

brightness(.75)
contrast(120%);


}


.banner-overlay{


position:absolute;


inset:0;



background:

linear-gradient(

to bottom,

transparent,

#090b10

);


}






/* =========================
 CONTENT
========================= */


.card-content{


padding:

0 25px 35px;


text-align:center;


}




/* =========================
 AVATAR
========================= */


.avatar-wrapper{


width:116px;


height:116px;


margin:-58px auto 18px;


position:relative;


z-index:5;


animation:

avatarGlow 5s infinite ease-in-out;


}



@keyframes avatarGlow{


0%,100%{


filter:

drop-shadow(
0 0 12px rgba(212,175,55,.4)
);


}



50%{


filter:

drop-shadow(
0 0 30px rgba(180,220,255,.8)
);


}



}



.avatar-frame{


width:100%;


height:100%;


padding:4px;



background:

linear-gradient(

135deg,

#ffe55c,

#d4af37,

#9e0b0f,

#330000

);



clip-path:

polygon(
30% 0,
70% 0,
100% 30%,
100% 70%,
70% 100%,
30% 100%,
0 70%,
0 30%
);



}



.avatar-img{


width:100%;


height:100%;


object-fit:cover;


background:black;



clip-path:

polygon(
30% 0,
70% 0,
100% 30%,
100% 70%,
70% 100%,
30% 100%,
0 70%,
0 30%
);



display:block;


}



/* =========================
 TITLE
========================= */


.detective-title{


font-family:var(--detective);


font-size:26px;


font-weight:900;


letter-spacing:4px;


margin-bottom:5px;


background:

linear-gradient(

white,

#d4af37

);


-webkit-background-clip:text;


-webkit-text-fill-color:transparent;



text-shadow:

0 5px 15px rgba(212,175,55,.4);


}



.case-code{


font-family:var(--code);


font-size:11px;


letter-spacing:2px;


color:#d4af37;


margin-bottom:15px;


}



.vtuber-lore{


font-size:13px;


line-height:1.6;


font-style:italic;


color:#d0d5e0;


margin-bottom:25px;


}



/* =========================
 BUTTON AREA
========================= */


.links-group{


display:flex;


flex-direction:column;


gap:14px;


margin-bottom:25px;


}




.btn-link{


position:relative;


display:flex;


align-items:center;


justify-content:space-between;


padding:

14px 20px;



background:

linear-gradient(

180deg,

#1d222e,

#10131a

);



border:

1px solid rgba(212,175,55,.3);



color:white;


text-decoration:none;


font-size:14px;


font-weight:600;


letter-spacing:1px;



overflow:hidden;



transition:

.35s ease;



box-shadow:

0 5px 10px black,

inset 0 1px rgba(255,255,255,.1);



}



.btn-link::before{


content:"►";


color:#d4af37;


margin-right:10px;


transition:.3s;


}




.btn-link:hover{


transform:

translateY(-4px);



border-color:#ffe55c;



box-shadow:


0 12px 25px black,

0 0 18px rgba(212,175,55,.35);


}



.btn-link:hover::before{


transform:

translateX(5px);


color:#ff3333;


}



/* DONATE */


.btn-donate{


background:

linear-gradient(

180deg,

#8a0c10,

#520507

);



border-color:#9e0b0f;


}



.btn-donate:hover{


background:

linear-gradient(

180deg,

#a81014,

#70080b

);


box-shadow:


0 12px 25px black,

0 0 25px rgba(158,11,15,.7);


}





/* =========================
 INFO BOX
========================= */


.info-grid{


background:#06080b;


padding:16px;


border:

1px solid rgba(255,255,255,.05);



box-shadow:

inset 0 5px 15px black;


text-align:left;


}



.info-title{


font-family:var(--code);


font-size:12px;


letter-spacing:2px;


color:#d4af37;


margin-bottom:10px;


}




.tag-list{


display:flex;


flex-wrap:wrap;


gap:8px;


list-style:none;


margin-bottom:15px;


}



.tag-item{


padding:

5px 10px;



background:

linear-gradient(

180deg,

#151820,

#090b10

);



border:

1px solid rgba(212,175,55,.25);



font-family:var(--code);


font-size:11px;


color:#b0b5c5;


}



.credits{


border-top:

1px dashed rgba(255,255,255,.15);



padding-top:10px;



display:flex;


justify-content:space-between;


font-family:var(--code);


font-size:11px;


color:#6a7080;


}



.credits b{


color:#d0d5e0;


}


</style>

</head>
