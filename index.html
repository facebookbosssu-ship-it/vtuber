<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEZ CARD</title>
    <style>
        /* =========================================
           1. สไตล์พื้นฐานและการจัดวาง
           ========================================= */
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        .card-container {
            position: relative;
            width: 380px;
            background: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            z-index: 10;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* ลูกเล่น: ยกการ์ดลอยขึ้นนิดหน่อยเมื่อเมาส์ชี้ */
        .card-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(102, 252, 241, 0.2);
        }

        /* ลูกเล่น: ตราประทับกะพริบแบบไฟสัญญาณเตือนภัย */
        .stamp-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff0055;
            color: #ffffff;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            z-index: 5;
            animation: pulse-red 1.5s infinite alternate;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 2px #ff0055; }
            100% { box-shadow: 0 0 12px #ff0055, 0 0 20px #ff0055; }
        }

        .banner-wrapper {
            position: relative;
            height: 120px;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card-container:hover .banner-img {
            transform: scale(1.05);
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, #1f2833, transparent);
        }

        .card-content {
            padding: 0 20px 20px 20px;
            text-align: center;
        }

        .avatar-wrapper {
            margin-top: -45px;
            margin-bottom: 5px;
            display: inline-block;
        }

        /* ลูกเล่น: กรอบรูปมีแสงนีออนหมุนรอบๆ */
        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #66fcf1, #45a29e, #ff0055);
            animation: rotate-glow 4s linear infinite;
        }

        @keyframes rotate-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #0b0c10;
            object-fit: cover;
            /* แก้หมุนกลับเพื่อให้รูปข้างในตรงเหมือนเดิม */
            animation: rotate-glow 4s linear infinite reverse; 
        }

        .detective-title {
            font-size: 1.8rem;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .case-code {
            font-size: 0.8rem;
            color: #66fcf1;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .vtuber-lore {
            font-style: italic;
            font-size: 0.9rem;
            color: #c5c6c7;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-left: 2px solid #66fcf1;
            border-radius: 0 4px 4px 0;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ลูกเล่น: ปุ่มกดมีลำแสงวิ่งผ่าน (Shine effect) */
        .btn-link {
            position: relative;
            text-decoration: none;
            color: #ffffff;
            background: #0b0c10;
            border: 1px solid #45a29e;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            overflow: hidden;
            z-index: 1;
        }

        .btn-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 252, 241, 0.3), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .btn-link:hover::before {
            left: 100%;
        }

        .btn-link:hover {
            background: #45a29e;
            color: #0b0c10;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }

        .btn-donate {
            background: #66fcf1;
            color: #0b0c10;
            border-color: #66fcf1;
        }

        .btn-donate:hover {
            background: #ff0055;
            border-color: #ff0055;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
        }

        .info-grid {
            margin-top: 20px;
            border-top: 1px solid #45a29e;
            padding-top: 15px;
        }

        .info-title {
            font-size: 0.75rem;
            color: #c5c6c7;
            margin-bottom: 10px;
        }

        .tag-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .tag-item {
            font-size: 0.7rem;
            background: #0b0c10;
            color: #66fcf1;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid #45a29e;
            transition: 0.2s;
        }

        .tag-item:hover {
            background: #66fcf1;
            color: #0b0c10;
            cursor: pointer;
        }

        .credits {
            display: flex;
            justify-content: space-around;
            font-size: 0.7rem;
            color: #c5c6c7;
        }

        /* =========================================
           2. สไตล์สำหรับหิมะ/ละอองแสงฉากหลัง
           ========================================= */
        .snowflake {
            position: fixed;
            top: -10px;
            color: #66fcf1;
            font-size: 1rem;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- โครงสร้าง HTML เดิมของคุณเป๊ะๆ -->
    <div class="card-container">
        
        <div class="stamp-badge">CASE #009 // SECRET</div>

        <div class="banner-wrapper">
            <img src="112.png" alt="VTuber Banner" class="banner-img">
            <div class="banner-overlay"></div>
        </div>

        <div class="card-content">
            
            <div class="avatar-wrapper">
                <div class="avatar-frame">
                    <img src="avatar.png" alt="VTuber Model" class="avatar-img">
                </div>
            </div>

            <h1 class="detective-title">SEZ</h1>
            <div class="case-code">[ STATUS: ACTIVE DETECTIVE ]</div>
            
            <p class="vtuber-lore">
                "เรื่องในวันนั้น...คนที่รู้ความจริงคือ ผมเอง"
            </p>

            <div class="links-group">
                <a href="https://www.youtube.com/@SeztionV" class="btn-link" target="_blank">
                    <span>📺 YOUTUBE CHANNEL</span>
                </a>

                <a href="https://facebook.com" class="btn-link" target="_blank">
                    <span>📘 FACEBOOK PAGE</span>
                </a>

                <a href="https://tiktok.com" class="btn-link" target="_blank">
                    <span>🎵 TIKTOK OFFICIAL</span>
                </a>

                <a href="https://discord.gg" class="btn-link" target="_blank">
                    <span>⚔️ HQ DISCORD SERVER</span>
                </a>

                <a href="https://tipme.in.th" class="btn-link btn-donate" target="_blank">
                    <span>💼 FUNDING & DONATE (สนับสนุน)</span>
                </a>
            </div>

            <div class="info-grid">
                <div class="info-title">EVIDENCE HASHTAGS</div>
                <ul class="tag-list">
                    <li class="tag-item">#SezLIVE</li>
                    <li class="tag-item">#SezArt</li>
                    <li class="tag-item">#SezMeme</li>
                </ul>

                <div class="credits">
                    <span><b>MAMA:</b> @ArtistName</span>
                    <span><b>PAPA:</b> @RiggerName</span>
                </div>
            </div>

        </div>

    </div>

    <!-- สคริปต์ปล่อยหิมะตกฉากหลัง (ลอยอยู่ด้านหลังการ์ด) -->
    <script>
        function createSnowflake() {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            
            // สุ่มใช้รูปเกล็ดหิมะ หรือละอองดาว
            const icons = ['❄', '✦', '✧', '•'];
            flake.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // สุ่มตำแหน่ง ความเร็ว ขนาด และความโปร่งแสง
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = Math.random() * 3 + 3 + 's'; 
            flake.style.opacity = Math.random() * 0.7 + 0.3;
            flake.style.fontSize = Math.random() * 10 + 8 + 'px';

            document.body.appendChild(flake);

            // ลบออกเมื่อตกลงไปพ้นจอ
            setTimeout(() => {
                flake.remove();
            }, 6000);
        }

        // ปล่อยหิมะทุกๆ 250 มิลลิวินาที
        setInterval(createSnowflake, 250);
    </script>

</body>
</html>
