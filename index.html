<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Profile - Sez Solomuel</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&family=Cinzel:wght@600;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CORE VARIABLES & DESIGN SYSTEM
           ========================================================================== */
        :root {
            --bg-base: #07070a;
            --bg-card: rgba(18, 18, 26, 0.85);
            
            /* Palette: Dark / Gold / Red */
            --gold-main: #ffd700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --red-main: #ff2a5f;
            --red-glow: rgba(255, 42, 95, 0.5);
            --dark-border: rgba(255, 215, 0, 0.25);
            
            --text-primary: #ffffff;
            --text-secondary: #c0c0d0;
            --text-muted: #707085;
            
            --font-title: 'Cinzel', 'Kanit', serif;
            --font-body: 'Kanit', sans-serif;
        }

        /* Reset & Global */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dynamic Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 42, 95, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.08) 0%, transparent 40%);
            z-index: -2;
        }

        .bg-magic-ring {
            position: absolute;
            width: 600px;
            height: 600px;
            border: 1px dashed rgba(255, 215, 0, 0.15);
            border-radius: 50%;
            z-index: -1;
            animation: rotateRing 40s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ==========================================================================
           2. MAIN CARD CONTAINER
           ========================================================================== */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.8),
                0 0 30px rgba(255, 42, 95, 0.15);
            border: 1px solid var(--dark-border);
            overflow: hidden;
        }

        /* Top Bar Highlight Effect */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--red-main), var(--gold-main), transparent);
            z-index: 10;
        }

        /* ==========================================================================
           3. BANNER & PROFILE AVATAR
           ========================================================================== */
        .banner-wrapper {
            width: 100%;
            height: 150px;
            position: relative;
            background-color: #1a1a2e;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 30%, var(--bg-card) 100%);
        }

        .card-content {
            padding: 0 28px 40px;
            text-align: center;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: -60px auto 15px; /* ลอยขึ้นไปเกยกับ Banner */
            z-index: 5;
        }

        .avatar-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--gold-main), var(--red-main));
            box-shadow: 0 0 25px var(--gold-glow);
            animation: float 4s ease-in-out infinite;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #12121a;
            display: block;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* ==========================================================================
           4. TYPOGRAPHY & BADGES
           ========================================================================== */
        .vtuber-title {
            font-family: var(--font-title);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 30%, var(--gold-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            margin-bottom: 6px;
        }

        .vtuber-lore {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 42, 95, 0.15);
            border: 1px solid var(--red-main);
            color: var(--red-main);
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: var(--red-main);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--red-main);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ==========================================================================
           5. ACTION BUTTONS & LINKS
           ========================================================================== */
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--dark-border);
            border-radius: 14px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.5px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .btn-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.15), transparent);
            transition: left 0.5s;
        }

        .btn-link:hover {
            border-color: var(--gold-main);
            background: rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-2px);
            color: var(--gold-main);
        }

        .btn-link:hover::before {
            left: 100%;
        }

        /* ปุ่มเน้นพิเศษ: Donate */
        .btn-link.btn-donate {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 42, 95, 0.2));
            border-color: var(--gold-main);
            color: var(--gold-main);
            font-weight: 800;
        }

        .btn-link.btn-donate:hover {
            background: linear-gradient(135deg, var(--gold-main), var(--red-main));
            color: #000;
            box-shadow: 0 0 25px var(--gold-glow);
        }

        /* ==========================================================================
           6. HASHTAGS & CREDITS
           ========================================================================== */
        .info-grid {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
            font-size: 13px;
        }

        .info-title {
            color: var(--gold-main);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            margin-bottom: 12px;
        }

        .tag-item {
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .credits {
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 11px;
        }

        .credits span b {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Background Magic Ring -->
    <div class="bg-magic-ring"></div>

    <!-- Main Card Container -->
    <div class="card-container">
        
        <!-- รูปปก / Banner Header -->
        <div class="banner-wrapper">
            <!-- เปลี่ยนชื่อไฟล์รูปปกตรงนี้ -->
            <img src="banner.png" alt="VTuber Banner" class="banner-img">
            <div class="banner-overlay"></div>
        </div>

        <div class="card-content">
            
            <!-- รูปโปรไฟล์ / Profile Avatar -->
            <div class="avatar-wrapper">
                <div class="avatar-frame">
                    <!-- เปลี่ยนชื่อไฟล์รูปโปรไฟล์ตรงนี้ -->
                    <img src="avatar.png" alt="VTuber Model" class="avatar-img">
                </div>
            </div>

            <!-- Name & Lore -->
            <h1 class="vtuber-title">SEZ SOLOMUEL</h1>
            <div class="badge-status">
                <div class="badge-dot"></div> LIVE / OFFLINE
            </div>
            <p class="vtuber-lore">
                "จอมเวทผู้ควบคุมมิติและเวลา สตรีมเมอร์สายเกมและเสียงดนตรี"
            </p>

            <!-- Social Links & Donate -->
            <div class="links-group">
                <!-- 1. YouTube -->
                <a href="https://youtube.com" class="btn-link" target="_blank">
                    📺 YouTube Channel
                </a>

                <!-- 2. Facebook Page -->
                <a href="https://facebook.com" class="btn-link" target="_blank">
                    📘 Facebook Page
                </a>

                <!-- 3. TikTok -->
                <a href="https://tiktok.com" class="btn-link" target="_blank">
                    🎵 TikTok
                </a>

                <!-- 4. Discord -->
                <a href="https://discord.gg" class="btn-link" target="_blank">
                    ⚔️ Discord Community
                </a>

                <!-- 5. Donate (ปุ่มโดเนทแบบเด่นพิเศษ) -->
                <a href="https://tipme.in.th" class="btn-link btn-donate" target="_blank">
                    👑 Support & Donate (โดเนท)
                </a>
            </div>

            <!-- Hashtags & Credits -->
            <div class="info-grid">
                <div class="info-title">📌 Official Hashtags</div>
                <ul class="tag-list">
                    <li class="tag-item">#SezLIVE</li>
                    <li class="tag-item">#SezArt</li>
                    <li class="tag-item">#SezMeme</li>
                </ul>

                <div class="credits">
                    <span><b>Mama (Art):</b> @ArtistName</span>
                    <span><b>Papa (Rig):</b> @RiggerName</span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
