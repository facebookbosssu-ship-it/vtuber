<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEZ - ACTIVE DETECTIVE [CASE #009]</title>
    <style>
        /* --- CSS เดิม (คงไว้ทั้งหมด) --- */
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* เพิ่มเพื่อให้หิมะไม่ทะลุหน้าจอ */
            position: relative; /* เพิ่มเพื่อวางเลเยอร์หิมะ */
        }

        .card-container {
            position: relative;
            width: 380px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 10; /* มั่นใจว่าการ์ดอยู่เหนือหิมะ */
        }

        .stamp-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f85149;
            color: white;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            z-index: 5;
        }

        .banner-wrapper {
            position: relative;
            height: 120px;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(to top, #161b22, transparent);
        }

        .card-content {
            padding: 0 20px 20px 20px;
            text-align: center;
        }

        .avatar-wrapper {
            margin-top: -45px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .avatar-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            padding: 2px;
            background: #30363d;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #0d1117;
            object-fit: cover;
        }

        .detective-title {
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .case-code {
            font-size: 0.8rem;
            color: #58a6ff;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
        }

        .vtuber-lore {
            font-style: italic;
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 20px;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-link {
            text-decoration: none;
            color: #c9d1d9;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-link:hover {
            background: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        .btn-donate {
            background: #238636;
            color: white;
            border-color: #2ea043;
        }

        .btn-donate:hover {
            background: #2ea043;
        }

        .info-grid {
            margin-top: 20px;
            border-top: 1px solid #30363d;
            padding-top: 15px;
        }

        .info-title {
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .tag-list {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .tag-item {
            font-size: 0.7rem;
            background: #21262d;
            color: #58a6ff;
            padding: 3px 8px;
            border-radius: 10px;
        }

        .credits {
            display: flex;
            justify-content: space-around;
            font-size: 0.7rem;
            color: #6e7681;
        }

        /* --- CSS ใหม่: เพิ่มลูกเล่นโดยไม่เปลี่ยนโครงสร้างหลัก --- */

        /* 1. ตัวควบคุมเลเยอร์หิมะ (Cyber Snow) */
        .snow-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* อยู่หลังการ์ด */
            pointer-events: none; /* เพื่อให้ยังกดคลิกการ์ดได้ปกติ */
        }

        /* 2. สไตล์ของเกล็ดหิมะ (ใช้ Pseudo-element เพื่อไม่เพิ่ม HTML tags เยอะ) */
        .snow-wrapper::after {
            content: "";
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 100%;
            /* สร้างภาพหิมะด้วย Radial Gradient หลายๆ จุด */
            background-image: 
                radial-gradient(circle, #fff 1px, transparent 1px),
                radial-gradient(circle, #fff 1px, transparent 1px),
                radial-gradient(circle, #58a6ff 1px, transparent 1px), /* หิมะสีฟ้าไซเบอร์ */
                radial-gradient(circle, #fff 1.5px, transparent 1.5px);
            background-size: 200px 200px, 150px 150px, 300px 300px, 250px 250px;
            background-position: 0 0, 50px 50px, 100px 100px, 150px 150px;
            animation: snow-fall 10s linear infinite;
            opacity: 0.6; /* ให้ดูฟุ้งๆ ไม่เด่นเกินไป */
        }

        /* 3. สไตล์ของกลุ่มก้อนพลังงาน (Floating Particles) */
        .particles-wrapper::before {
            content: "";
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 15px;
            height: 15px;
            background: #58a6ff;
            border-radius: 50%;
            filter: blur(5px);
            box-shadow: 0 0 10px #58a6ff, 0 0 20px #58a6ff;
            animation: particle-float 6s ease-in-out infinite;
            opacity: 0.3;
            z-index: 1;
        }
        
        /* 4. เพิ่มขอบแสงนีออนอ่อนๆ เมื่อเมาส์ชี้ที่การ์ด (นิดเดียว ไม่เปลี่ยนรูปทรง) */
        .card-container:hover {
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.3);
            border-color: #58a6ff;
            transition: 0.3s ease-in-out;
        }

        /* 5. เอฟเฟกต์ Glitch สั้นๆ ที่ชื่อเมื่อโหลดหน้า (แค่ให้ดูตื่นเต้น) */
        @keyframes glitch {
            0% { text-shadow: 0.5px 0 0 #f85149, -0.5px 0 0 #58a6ff; }
            100% { text-shadow: none; }
        }
        .detective-title {
            animation: glitch 1s ease-out; /* เล่นแค่ครั้งเดียวตอนโหลด */
        }

        /* --- Animations (Keyframes) --- */

        @keyframes snow-fall {
            from { background-position: 0 0, 50px 50px, 100px 100px, 150px 150px; }
            to { background-position: 0 1000px, 50px 1050px, 100px 1100px, 150px 1150px; }
        }

        @keyframes particle-float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
            50% { transform: translateY(-50px) translateX(20px); opacity: 0.5; }
        }

    </style>
</head>
<body>

    <!-- เลเยอร์ลูกเล่นพื้นหลัง (หิมะและอนุภาค) -->
    <div class="snow-wrapper particles-wrapper"></div>

    <!-- --- โครงสร้าง HTML เดิม (คงไว้ทั้งหมด) --- -->
    <div class="card-container">
        
        <div class="stamp-badge">CASE #009 // SECRET</div>

        <div class="banner-wrapper">
            <!-- เพื่อให้โค้ดรันได้ทันที ผมใช้ภาพ placeholder แทนไฟล์โลคอลของคุณครับ -->
            <img src="https://picsum.photos/id/1059/600/200" alt="VTuber Banner" class="banner-img">
            <div class="banner-overlay"></div>
        </div>

        <div class="card-content">
            
            <div class="avatar-wrapper">
                <div class="avatar-frame">
                    <!-- เพื่อให้โค้ดรันได้ทันที ผมใช้ภาพ placeholder แทนไฟล์โลคอลของคุณครับ -->
                    <img src="https://picsum.photos/id/64/200/200" alt="VTuber Model" class="avatar-img">
                </div>
            </div>

            <h1 class="detective-title">SEZ</h1>
            <div class="case-code">[ STATUS: ACTIVE DETECTIVE ]</div>
            
            <p class="vtuber-lore">
                "เรื่องในวันนั้น...คนที่รู้ความจริงคือ ผมเอง"
            </p>

            <div class="links-group">
                <a href="https://www.youtube.com/@SeztionV" class="btn-link" target="_blank">
                    <span>📺 YOUTUBE CHANNEL</span>
                </a>

                <a href="https://facebook.com" class="btn-link" target="_blank">
                    <span>📘 FACEBOOK PAGE</span>
                </a>

                <a href="https://tiktok.com" class="btn-link" target="_blank">
                    <span>🎵 TIKTOK OFFICIAL</span>
                </a>

                <a href="https://discord.gg" class="btn-link" target="_blank">
                    <span>⚔️ HQ DISCORD SERVER</span>
                </a>

                <a href="https://tipme.in.th" class="btn-link btn-donate" target="_blank">
                    <span>💼 FUNDING & DONATE (สนับสนุน)</span>
                </a>
            </div>

            <div class="info-grid">
                <div class="info-title">EVIDENCE HASHTAGS</div>
                <ul class="tag-list">
                    <li class="tag-item">#SezLIVE</li>
                    <li class="tag-item">#SezArt</li>
                    <li class="tag-item">#SezMeme</li>
                </ul>

                <div class="credits">
                    <span><b>MAMA:</b> @ArtistName</span>
                    <span><b>PAPA:</b> @RiggerName</span>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
