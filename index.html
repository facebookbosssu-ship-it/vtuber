<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTuber Profile</title>
    <style>
        /* ตั้งค่าธีมสีและสไตล์หลัก */
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --accent-color: #7b2cbf;
            --text-color: #ffffff;
            --subtext-color: #a0a0c0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            object-fit: cover;
        }

        h1 { margin: 15px 0 5px; font-size: 24px; }
        .lore { color: var(--subtext-color); font-size: 14px; margin-bottom: 20px; }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background-color: #9d4edd;
        }

        .hashtags {
            margin-top: 25px;
            font-size: 13px;
            color: var(--subtext-color);
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 10px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- รูปโปรไฟล์/โมเดล -->
        <img src="ไม่มีชื่อ 20_20260622195823" alt="VTuber Model" class="avatar">
        
        <!-- ชื่อและ Lore -->
        <h1>VTuber Name ✦</h1>
        <p class="lore">"คำพูดติดปาก หรือ Lore สั้นๆ ของตัวละคร"</p>

        <!-- ปุ่มลิงก์โซเชียล -->
        <div class="links-container">
            <a href="#" class="link-btn" target="_blank">📺 YouTube</a>
            <a href="#" class="link-btn" target="_blank">💜 Twitch</a>
            <a href="#" class="link-btn" target="_blank">💬 Twitter / X</a>
            <a href="#" class="link-btn" target="_blank">🎁 Marshmallow</a>
        </div>

        <!-- แฮชแท็ก -->
        <div class="hashtags">
            <p>📌 <b>Hashtags</b></p>
            <p>• Live: #VTuberLIVE</p>
            <p>• Fanart: #VTuberArt</p>
        </div>
    </div>

</body>
</html>
